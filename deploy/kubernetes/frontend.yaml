apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexaflow-frontend
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexaflow-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexaflow-frontend
    spec:
      serviceAccountName: nexaflow-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nexaflow-frontend
      containers:
        - name: frontend
          image: ghcr.io/neostacklab/nexaflow-frontend:replace-with-immutable-digest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: NODE_ENV, value: production}
            - {name: NEXAFLOW_INTERNAL_API_URL, value: "http://nexaflow-backend:8080/api/v1"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              exec: {command: ["/bin/sh", "-c", "sleep 5"]}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: nexaflow-frontend
spec:
  selector:
    app.kubernetes.io/name: nexaflow-frontend
  ports:
    - {name: http, port: 3000, targetPort: http}
