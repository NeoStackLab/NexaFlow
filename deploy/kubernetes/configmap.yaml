apiVersion: v1
kind: ConfigMap
metadata:
  name: nexaflow-runtime
data:
  APP_ENV: production
  SERVER_PORT: "8080"
  SERVER_SHUTDOWN_TIMEOUT: 30s
  DATABASE_HOST: postgres.example.internal
  DATABASE_PORT: "5432"
  DATABASE_USER: nexaflow_app
  DATABASE_NAME: nexaflow
  DATABASE_SSLMODE: verify-full
  REDIS_HOST: redis.example.internal
  REDIS_PORT: "6379"
  CORS_ALLOWED_ORIGINS: https://nexaflow.example.com
  LOG_LEVEL: info
  LOG_FORMAT: json
  INSTALL_DATA_DIR: /app/data
  INSTALL_MODE: manual
  STORAGE_PROVIDER: s3
  STORAGE_ENDPOINT: https://s3.example.com
  STORAGE_REGION: us-east-1
  STORAGE_BUCKET: nexaflow-production
  OBSERVABILITY_ENABLED: "true"
  OBSERVABILITY_ENDPOINT: otel-collector.monitoring.svc.cluster.local:4318
  OBSERVABILITY_INSECURE: "false"
  JOBS_CONCURRENCY: "4"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexaflow-backup
data:
  PGHOST: postgres.example.internal
  PGPORT: "5432"
  PGDATABASE: nexaflow
  PGUSER: nexaflow_app
  PGADMIN_USER: nexaflow_admin
  BACKUP_S3_URI: s3://nexaflow-backups/database
  BACKUP_S3_REGION: us-east-1
  BACKUP_S3_ENDPOINT: https://s3.example.com
  BACKUP_RETENTION_DAYS: "35"
  BACKUP_EVIDENCE_S3_URI: s3://nexaflow-backups/restore-evidence
  BACKUP_EVIDENCE_DIR: /evidence
