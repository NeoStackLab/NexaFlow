  storage-secret-access-key: replace-me
---
apiVersion: v1
kind: Secret
metadata:
  name: nexaflow-backup
  namespace: nexaflow
type: Opaque
stringData:
  database-password: replace-me
  postgres-admin-password: replace-me
  age-recipient: age1replace-me
  age-identity: AGE-SECRET-KEY-1REPLACE-ME
  signing-private-key: replace-with-passwordless-minisign-private-key
  signing-public-key: replace-with-minisign-public-key
  s3-access-key-id: replace-me
  s3-secret-access-key: replace-me
