apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexaflow-backend
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexaflow-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexaflow-backend
    spec:
      serviceAccountName: nexaflow-runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nexaflow-backend
      containers:
        - name: backend
          image: ghcr.io/neostacklab/nexaflow-backend:replace-with-immutable-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: nexaflow-runtime}
          env:
            - {name: DATABASE_PASSWORD_FILE, value: /run/secrets/database-password}
            - {name: REDIS_PASSWORD_FILE, value: /run/secrets/redis-password}
            - {name: AUTH_JWT_SECRET_FILE, value: /run/secrets/jwt-secret}
            - {name: STORAGE_ACCESS_KEY_ID_FILE, value: /run/secrets/storage-access-key-id}
            - {name: STORAGE_SECRET_ACCESS_KEY_FILE, value: /run/secrets/storage-secret-access-key}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          lifecycle:
            preStop:
              exec: {command: ["/bin/sh", "-c", "sleep 10"]}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret: {secretName: nexaflow-runtime, defaultMode: 0440}
        - name: data
          emptyDir: {sizeLimit: 64Mi}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: nexaflow-backend
spec:
  selector:
    app.kubernetes.io/name: nexaflow-backend
  ports:
    - {name: http, port: 8080, targetPort: http}
