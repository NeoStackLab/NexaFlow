name: nexaflow

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexaflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-nexaflow}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexaflow

  redis:
    image: redis:8.8.1-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nexaflow_dev}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-nexaflow_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH='$${REDIS_PASSWORD}' redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nexaflow

  backend:
    build:
      context: ../backend
      args:
        VERSION: ${NEXAFLOW_VERSION:-dev}
    restart: unless-stopped
    environment:
      APP_ENV: production
      SERVER_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-nexaflow}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-nexaflow_dev}
      DATABASE_NAME: ${POSTGRES_DB:-nexaflow}
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-nexaflow_dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: info
      LOG_FORMAT: json
      INSTALL_DATA_DIR: /app/data
      INSTALL_MODE: docker
      AUTH_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to at least 32 random characters}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-5-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      BILLING_STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      BILLING_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BILLING_STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      BILLING_STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-http://localhost:3000/admin/billing?checkout=success}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-http://localhost:3000/admin/billing?checkout=cancel}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/data/uploads}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - nexaflow_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexaflow

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXAFLOW_INTERNAL_API_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexaflow

volumes:
  postgres_data:
  redis_data:
  nexaflow_data:

networks:
  nexaflow:
    driver: bridge
