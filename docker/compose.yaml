name: nexaflow

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-nexaflow}
      NEXAFLOW_DB_USER: ${DATABASE_USER:-nexaflow_app}
      NEXAFLOW_DB_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-nexaflow-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexaflow

  database-role-init:
    image: pgvector/pgvector:0.8.6-pg18
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-nexaflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-nexaflow}
      POSTGRES_USER: ${POSTGRES_USER:-nexaflow}
      POSTGRES_DB: ${POSTGRES_DB:-nexaflow}
      NEXAFLOW_DB_USER: ${DATABASE_USER:-nexaflow_app}
      NEXAFLOW_DB_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
    volumes:
      - ./init-db.sh:/opt/nexaflow/init-db.sh:ro
    command: ["bash", "/opt/nexaflow/init-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexaflow

  redis:
    image: redis:8.8.1-alpine3.23
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nexaflow

  backend:
    build:
      context: ../backend
      args:
        VERSION: ${NEXAFLOW_VERSION:-dev}
    restart: unless-stopped
    command: ["-config", "/app/configs/config.production.yaml"]
    environment:
      APP_ENV: production
      SERVER_PORT: 8080
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-nexaflow_app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      DATABASE_NAME: ${POSTGRES_DB:-nexaflow}
      DATABASE_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: info
      LOG_FORMAT: json
      INSTALL_DATA_DIR: /app/data
      INSTALL_MODE: docker
      AUTH_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to at least 32 random characters}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-5-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_INPUT_COST_PER_MILLION_TOKENS: ${AI_INPUT_COST_PER_MILLION_TOKENS:-0}
      AI_OUTPUT_COST_PER_MILLION_TOKENS: ${AI_OUTPUT_COST_PER_MILLION_TOKENS:-0}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      OBSERVABILITY_ENDPOINT: ${OBSERVABILITY_ENDPOINT:-otel-collector:4318}
      OBSERVABILITY_INSECURE: ${OBSERVABILITY_INSECURE:-true}
      OBSERVABILITY_SAMPLE_RATIO: ${OBSERVABILITY_SAMPLE_RATIO:-1.0}
      OBSERVABILITY_METRIC_INTERVAL: ${OBSERVABILITY_METRIC_INTERVAL:-15s}
      JOBS_NAMESPACE: ${JOBS_NAMESPACE:-nexaflow}
      JOBS_CONCURRENCY: ${JOBS_CONCURRENCY:-4}
      JOBS_POLL_INTERVAL: ${JOBS_POLL_INTERVAL:-250ms}
      JOBS_LEASE_TIMEOUT: ${JOBS_LEASE_TIMEOUT:-2m}
      JOBS_RETRY_BASE: ${JOBS_RETRY_BASE:-5s}
      JOBS_RETRY_MAX: ${JOBS_RETRY_MAX:-15m}
      JOBS_IDEMPOTENCY_TTL: ${JOBS_IDEMPOTENCY_TTL:-24h}
      KNOWLEDGE_WORKER_INTERVAL: ${KNOWLEDGE_WORKER_INTERVAL:-5s}
      KNOWLEDGE_BATCH_SIZE: ${KNOWLEDGE_BATCH_SIZE:-5}
      KNOWLEDGE_MAX_ATTEMPTS: ${KNOWLEDGE_MAX_ATTEMPTS:-3}
      BILLING_STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      BILLING_STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BILLING_STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      BILLING_STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-http://localhost:3000/admin/billing?checkout=success}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-http://localhost:3000/admin/billing?checkout=cancel}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/data/uploads}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      NOTIFICATIONS_SMTP_HOST: ${NOTIFICATIONS_SMTP_HOST:-}
      NOTIFICATIONS_SMTP_PORT: ${NOTIFICATIONS_SMTP_PORT:-587}
      NOTIFICATIONS_SMTP_USERNAME: ${NOTIFICATIONS_SMTP_USERNAME:-}
      NOTIFICATIONS_SMTP_PASSWORD: ${NOTIFICATIONS_SMTP_PASSWORD:-}
      NOTIFICATIONS_SMTP_FROM: ${NOTIFICATIONS_SMTP_FROM:-}
      NOTIFICATIONS_WEBHOOK_ALLOWLIST: ${NOTIFICATIONS_WEBHOOK_ALLOWLIST:-}
      NOTIFICATIONS_WORKER_INTERVAL: ${NOTIFICATIONS_WORKER_INTERVAL:-10s}
      NOTIFICATIONS_BATCH_SIZE: ${NOTIFICATIONS_BATCH_SIZE:-25}
      NOTIFICATIONS_MAX_ATTEMPTS: ${NOTIFICATIONS_MAX_ATTEMPTS:-8}
    ports:
      - "8080:8080"
    volumes:
      - nexaflow_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      database-role-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexaflow

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXAFLOW_INTERNAL_API_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexaflow

volumes:
  postgres_data:
  redis_data:
  nexaflow_data:

networks:
  nexaflow:
    driver: bridge
